# AgentDesk local intent + slot model: the intents, their slots and the TEMPLATES that build the seed dataset.
#
# A template is a sentence with {slot} placeholders. Several templates for one language are written on one line, separated by " | ".
# A leading "!" marks a template as a CORRECTION of the previous request ("is_correction": true).
# Slot values come from `fillers` below (or from the real sentences people add to data/real/*.jsonl, see docs/DATASET_GUIDE.md).
# Add templates, fillers or whole intents here, then run:  ml\.venv\Scripts\python ml\build_dataset.py
#
# HONEST NOTE: these seed templates were written by one author (Claude), not collected from real speakers. A model trained on them alone
# looks better on its own test split than it will on real people. Real sentences from you, Mirha and classmates (docs/DATASET_GUIDE.md)
# are what make the numbers meaningful. Each intent has 3-6 templates per language here; the guide asks you to bring it to 10+.
version: 1
languages: [en, roman_ur, ur, hi]

fillers:
  app: [Chrome, Notepad, File Explorer, Calculator, Word, Excel, PowerPoint, Spotify, Paint, Task Manager, Firefox, Edge, VS Code, Settings, WhatsApp, Telegram, Zoom, Teams, Camera, Photos, Outlook, Discord, VLC, Command Prompt]
